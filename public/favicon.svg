    <rect x="4" y="18" width="17" height="6" />
    <rect x="9.5" y="18" width="6" height="28" />
  </g>
  <g fill="#7fe89a">
    <rect x="23.5" y="18" width="17" height="6" />
    <rect x="23.5" y="18" width="6" height="28" />
    <rect x="23.5" y="28" width="13" height="6" />
  </g>
  <g fill="#7cd0ff">
    <rect x="43" y="18" width="17" height="6" />
    <rect x="48.5" y="18" width="6" height="28" />
  </g>
</svg>
