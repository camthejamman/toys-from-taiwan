<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 56 984 198">
  <!-- strap pins (black, protrude from outline) -->
  <circle cx="30" cy="121" r="9" fill="#020202"/>
  <circle cx="968" cy="155" r="10" fill="#020202"/>

  <!-- rectangular slab body (keys live here) -->
  <rect x="400" y="70" width="560" height="170" rx="12" fill="#020202"/>
  <!-- slim neck extending left -->
  <rect x="100" y="90" width="312" height="62" fill="#020202"/>
  <!-- neck-to-body fillets -->
  <path fill="#020202" d="M 400 106 Q 400 90 384 90 L 400 90 Z"/>
  <path fill="#020202" d="M 400 136 Q 400 152 384 152 L 400 152 Z"/>
  <!-- headstock / handle grip -->
  <rect x="36" y="78" width="74" height="86" rx="14" fill="#020202"/>

  <!-- keybed: 19 white keys + 13 sharps = 32 mini keys -->
  <rect x="414" y="150" width="532" height="82" rx="3" fill="#FFFFFF"/>
  <!-- white key separators (all 18 boundaries) -->
  <g fill="#020202">
    <rect x="439.5" y="150" width="5" height="82"/>
    <rect x="467.5" y="150" width="5" height="82"/>
    <rect x="495.5" y="150" width="5" height="82"/>
    <rect x="523.5" y="150" width="5" height="82"/>
    <rect x="551.5" y="150" width="5" height="82"/>
    <rect x="579.5" y="150" width="5" height="82"/>
    <rect x="607.5" y="150" width="5" height="82"/>
    <rect x="635.5" y="150" width="5" height="82"/>
    <rect x="663.5" y="150" width="5" height="82"/>
    <rect x="691.5" y="150" width="5" height="82"/>
    <rect x="719.5" y="150" width="5" height="82"/>
    <rect x="747.5" y="150" width="5" height="82"/>
    <rect x="775.5" y="150" width="5" height="82"/>
    <rect x="803.5" y="150" width="5" height="82"/>
    <rect x="831.5" y="150" width="5" height="82"/>
    <rect x="859.5" y="150" width="5" height="82"/>
    <rect x="887.5" y="150" width="5" height="82"/>
    <rect x="915.5" y="150" width="5" height="82"/>
  </g>
  <!-- sharps: C# D# / F# G# A# pattern -->
  <g fill="#020202">
    <rect x="435" y="150" width="14" height="52"/>
    <rect x="463" y="150" width="14" height="52"/>
    <rect x="519" y="150" width="14" height="52"/>
    <rect x="547" y="150" width="14" height="52"/>
    <rect x="575" y="150" width="14" height="52"/>
    <rect x="631" y="150" width="14" height="52"/>
    <rect x="659" y="150" width="14" height="52"/>
    <rect x="715" y="150" width="14" height="52"/>
    <rect x="743" y="150" width="14" height="52"/>
    <rect x="771" y="150" width="14" height="52"/>
    <rect x="827" y="150" width="14" height="52"/>
    <rect x="855" y="150" width="14" height="52"/>
    <rect x="911" y="150" width="14" height="52"/>
  </g>

  <!-- panel above keys: LCD, function buttons, knobs, speaker bars -->
  <rect x="424" y="86" width="70" height="42" rx="4" fill="#FFFFFF"/>
  <g fill="#FFFFFF">
    <rect x="516" y="96" width="13" height="20" rx="4"/>
    <rect x="540" y="96" width="13" height="20" rx="4"/>
    <rect x="564" y="96" width="13" height="20" rx="4"/>
    <rect x="588" y="96" width="13" height="20" rx="4"/>
    <rect x="612" y="96" width="13" height="20" rx="4"/>
    <rect x="636" y="96" width="13" height="20" rx="4"/>
    <rect x="660" y="96" width="13" height="20" rx="4"/>
    <rect x="684" y="96" width="13" height="20" rx="4"/>
  </g>
  <circle cx="730" cy="106" r="8" fill="#FFFFFF"/>
  <circle cx="758" cy="106" r="8" fill="#FFFFFF"/>
  <rect x="810" y="88" width="120" height="13" rx="6" fill="#FFFFFF"/>
  <rect x="810" y="112" width="120" height="13" rx="6" fill="#FFFFFF"/>

  <!-- neck: pitch wheel near body + a few performance buttons -->
  <circle cx="350" cy="121" r="15" fill="#FFFFFF"/>
  <circle cx="350" cy="121" r="6" fill="#020202"/>
  <g fill="#FFFFFF">
    <rect x="170" y="111" width="12" height="20" rx="4"/>
    <rect x="194" y="111" width="12" height="20" rx="4"/>
    <rect x="218" y="111" width="12" height="20" rx="4"/>
  </g>

  <!-- headstock: two knobs + volume slider -->
  <circle cx="60" cy="102" r="8" fill="#FFFFFF"/>
  <circle cx="60" cy="102" r="3" fill="#020202"/>
  <circle cx="88" cy="102" r="8" fill="#FFFFFF"/>
  <circle cx="88" cy="102" r="3" fill="#020202"/>
  <rect x="48" y="128" width="50" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="64" y="123" width="9" height="24" rx="2" fill="#020202"/>
</svg>
